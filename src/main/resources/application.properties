spring.application.name=techcup-backend
server.port=8080
# Para funcionamiento de swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Logs SLF4J
logging.file.name=logs/techcup.log
logging.level.edu.dosw.techcup=INFO
logging.level.root=WARN

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/techcup
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#seguridad
spring.security.user.name=techcup
spring.security.user.password=techcup123